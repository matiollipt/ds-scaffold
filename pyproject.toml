[project]
name = "ds-scaffold"
version = "0.1.0"
description = "Auto-generate a standardized project structure for modern data science projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "AidBio", email = "clever.dspy@gmail.com" }
]

keywords = ["data-science", "scaffold", "project-template", "cli"]

classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "typer>=0.9.0",
  "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/AidBio/ds-scaffold"
Repository = "https://github.com/AidBio/ds-scaffold"
Issues = "https://github.com/AidBio/ds-scaffold/issues"

[project.scripts]
ds-scaffold = "ds_scaffold.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "ds_scaffold/**",
  "README.md",
  "LICENSE",
]